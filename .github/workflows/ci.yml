name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'arc-observation-js' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run check:lint

      - name: Check formatting
        run: bun run check:format

      - name: Check Bun-native dependencies
        run: bun run check:bun-native

      - name: Build
        run: bun run build

      - name: Run tests with coverage
        # Gate on the deterministic, mocked integration suite. The e2e suite
        # hits the live third-party API and is run separately (non-blocking)
        # so transient network/timeouts don't block merges and releases.
        run: bun test tests/integration/ --coverage --coverage-reporter="lcov"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run e2e tests (non-blocking, live API)
        continue-on-error: true
        run: bun run test:e2e

  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    # GitHub-hosted runner: npm OIDC trusted publishing requires it.
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      # Required for npm trusted publishing (OIDC) — no NPM_TOKEN needed.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Setup Node
        # Only the publish step runs on Node: bun publish cannot do npm
        # trusted publishing (OIDC/provenance) yet. Node 24 satisfies
        # semantic-release's engine (>=24.10) and ships npm >=11 for OIDC.
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Release
        # Publishes to npm via OIDC trusted publishing (configured on npmjs.com),
        # so no NPM_TOKEN is required.
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
